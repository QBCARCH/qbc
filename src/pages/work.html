{{> head}}
{{> nav}}
<main class="page" id="main">
  <section class="phero">
    <div class="phero__media">{{HERO_IMG}}</div>
    <div class="phero__content">
      <h1 class="phero__title display">{{TITLE_TEXT}}</h1>
      <p class="label">{{YEAR}}</p>
    </div>
  </section>

  <section class="pinfo sec wrap grid">
    <aside class="pinfo__side">
      <div><p class="label mute">Year</p><p>{{YEAR}}</p></div>
      <div><p class="label mute">Services</p><ul>{{SERVICES}}</ul></div>
      <a class="btn" href="../our-work.html"><span class="btn__arrow" aria-hidden="true">←</span><span>All projects</span></a>
      {{PREV}}
    </aside>
    <div class="pinfo__text" data-reveal>{{DESCRIPTION}}</div>
  </section>

  <section class="pgal">{{GALLERY}}</section>

  {{NEXT}}
</main>
{{> footer}}
