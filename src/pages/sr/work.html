{{> head}}
{{> nav}}
<main class="page" id="main">
  <section class="phero">
    <div class="phero__media">{{HERO_IMG}}</div>
    <div class="phero__content">
      <h1 class="phero__title display">{{TITLE_TEXT}}</h1>
      <p class="label">{{LOC_YEAR}}</p>
    </div>
  </section>

  <nav class="psub label" aria-label="Pregled">
    <div class="psub__in"><span class="psub__t">{{TITLE_TEXT}}</span><span class="psub__l"><a href="#overview">Pregled</a><a href="#gallery">Galerija</a><a class="psub__cta" href="#inquiry">Započnite projekat</a></span></div>
  </nav>

  <section class="pinfo sec wrap grid" id="overview">
    <aside class="pinfo__side">
      {{FACTS}}
      <a class="btn" href="../our-work.html"><span class="btn__arrow" aria-hidden="true">←</span><span>Svi projekti</span></a>
      {{PREV}}
    </aside>
    <div class="pinfo__text" data-reveal>{{DESCRIPTION}}</div>
  </section>

  <section class="pgal{{GAL_CLASS}}" id="gallery">{{GALLERY}}</section>

  {{NEXT}}
</main>
{{> footer}}
