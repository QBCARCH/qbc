{{> head}}
{{> nav}}
<main class="page" id="main">
  <section class="phero">
    <div class="phero__media">{{HERO_IMG}}</div>
    <p class="phero__year" aria-label="Year">{{YEAR}}</p>
    <div class="phero__content">
      <p class="mono" style="margin-bottom:1rem">Project /</p>
      <h1 class="phero__title display" data-split>{{TITLE_TEXT}}</h1>
    </div>
  </section>

  <section class="pinfo sec wrap grid">
    <aside class="pinfo__side">
      <div><p class="mono mute">Year</p><p>{{YEAR}}</p></div>
      <div><p class="mono mute">Services</p><ul>{{SERVICES}}</ul></div>
      <a class="btn" href="../our-work.html"><span class="btn__arrow" aria-hidden="true" style="transform:scaleX(-1)">↠</span><span>All projects</span></a>
    </aside>
    <div class="pinfo__text" data-reveal>{{DESCRIPTION}}</div>
  </section>

  <section class="pgal">{{GALLERY}}</section>

  {{NEXT}}
</main>
{{> footer}}
